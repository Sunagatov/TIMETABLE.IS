[project]
name = "memora-telegram-bot"
version = "0.1.0"
description = "Thin Telegram adapter for Memora"
requires-python = ">=3.12"
dependencies = [
  "python-telegram-bot>=21.9",
  "httpx>=0.28.1"
]

[project.scripts]
memora-bot = "memora_bot.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["memora_bot*"]
