spring:
  application:
    name: memora-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/memora}

server:
  port: ${BACKEND_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

memora:
  storage:
    mode: ${MEMORA_STORAGE_MODE:mongo}
  allowed-origin: ${BACKEND_ALLOWED_ORIGIN:http://localhost:5173}
  app-password: ${BACKEND_APP_PASSWORD:}
  app-password-hash: ${BACKEND_APP_PASSWORD_HASH:$2y$10$xH.zhKTca6J1u513ef0STe7Y5Jc1ZuxVyNszPWV/lOMysTGwsukza}
  session-days: ${BACKEND_SESSION_DAYS:30}
  bot-ingest-token: ${BACKEND_BOT_INGEST_TOKEN:change-me}
  owner-telegram-user-id: ${MEMORA_OWNER_TELEGRAM_USER_ID:owner-telegram-user-id}
  default-category-path: ${DEFAULT_CATEGORY_PATH:Default/General/Inbox}
  transcription-auto-retry-attempts: ${MEMORA_TRANSCRIPTION_AUTO_RETRY_ATTEMPTS:3}
  ai-auto-retry-attempts: ${MEMORA_AI_AUTO_RETRY_ATTEMPTS:2}
  telegram-bot-token: ${MEMORA_TELEGRAM_BOT_TOKEN:}
  telegram-api-base-url: ${MEMORA_TELEGRAM_API_BASE_URL:https://api.telegram.org}
  transcription-api-key: ${MEMORA_TRANSCRIPTION_API_KEY:}
  transcription-api-base-url: ${MEMORA_TRANSCRIPTION_API_BASE_URL:https://api.openai.com}
  transcription-model: ${MEMORA_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}
  transcription-language: ${MEMORA_TRANSCRIPTION_LANGUAGE:}
  transcription-timeout-seconds: ${MEMORA_TRANSCRIPTION_TIMEOUT_SECONDS:120}
